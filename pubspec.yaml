name: m3u8_down
description: 基于 Flutter 的 M3U8 视频下载与合并工具
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # 网络请求
  dio: ^5.4.0
  http: ^1.2.0
  
  # FFmpeg 封装
  ffmpeg_kit_flutter_new: ^4.6.3
  
  # 视频播放
  video_player: ^2.8.1
  chewie: ^1.7.2
  
  # 本地存储
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # 文件选择
  file_picker: ^10.0.0
  
  # 权限管理
  permission_handler: ^11.0.1
  
  # 打开文件/链接 (移动端适配)
  url_launcher: ^6.2.2
  open_filex: ^4.4.0
  
  # 路径获取
  path_provider: ^2.1.2
  
  # 加密
  crypto: ^3.0.3
  pointycastle: ^3.8.0
  
  # 状态管理
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png

  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf